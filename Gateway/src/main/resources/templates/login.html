<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bank Portal</title>
</head>
<body>
<h2>Login</h2>
<form action="/auth/login" method="post">
    <label>Username:</label>
    <input type="text" name="username" required/><br/>
    <label>Password:</label>
    <input type="password" name="password" required/><br/>
    <button type="submit">Login</button>
</form>
<p id="login-status" role="status"></p>
<script>
    let accessToken = null;
    document.querySelector('form').addEventListener('submit', async (event) => {
        event.preventDefault();
        accessToken = null;
        const form = event.currentTarget;
        const status = document.getElementById('login-status');
        status.textContent = 'Signing in...';
        try {
            const response = await fetch('/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                credentials: 'omit',
                body: JSON.stringify({username: form.username.value, password: form.password.value})
            });
            if (!response.ok) {
                status.textContent = response.status === 401
                    ? 'Incorrect username or password.' : 'Unable to sign in. Please try again.';
                return;
            }
            accessToken = (await response.json()).accessToken;
            status.textContent = 'Signed in successfully.';
        } catch (error) {
            status.textContent = 'Unable to sign in. Please try again.';
        } finally {
            form.password.value = '';
        }
    });
</script>
</body>
</html>
