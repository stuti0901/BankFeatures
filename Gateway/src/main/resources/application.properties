spring.application.name=gateway
server.port=7000

spring.cloud.gateway.server.webflux.routes[0].id=account-service
spring.cloud.gateway.server.webflux.routes[0].uri=${ACCOUNTS_SERVICE_URL:http://localhost:8080}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/accounts/api/**

spring.cloud.gateway.server.webflux.routes[1].id=cards-service
spring.cloud.gateway.server.webflux.routes[1].uri=${CARDS_SERVICE_URL:http://localhost:9000}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/cards/api/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[2].id=loans-service
spring.cloud.gateway.server.webflux.routes[2].uri=${LOANS_SERVICE_URL:http://localhost:8090}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/loans/api/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1
